<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Carousel + Social Bar — Speaking Pictures Component</title>
<style>

  /* ════════════════════════════════════════════════════════
     TOKENS — match speaking.pictures palette
     ════════════════════════════════════════════════════════ */
  :root {
    --bg:       #0C0C0C;
    --surface:  #141414;
    --text:     #EDEBE6;
    --muted:    #888580;
    --dim:      #4A4845;
    --accent:   #C8963C;
    --border:   #252525;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    padding: 4rem 0;
  }

  .eyebrow {
    display: block;
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .section-heading {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 3rem;
  }


  /* ════════════════════════════════════════════════════════
     LOGO CAROUSEL — infinite auto-scroll, pauses on hover
     ════════════════════════════════════════════════════════ */
  .logo-carousel {
    position: relative;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto 5rem;
    overflow: hidden;
    /* Fade edges so logos appear to emerge/disappear smoothly */
    -webkit-mask-image: linear-gradient(
      to right, transparent 0%, black 8%, black 92%, transparent 100%
    );
    mask-image: linear-gradient(
      to right, transparent 0%, black 8%, black 92%, transparent 100%
    );
  }

  .logo-track {
    display: flex;
    align-items: center;
    gap: 4.5rem;
    width: max-content;
    animation: scroll-left 32s linear infinite;
  }

  /* Pause the whole track on hover — nice affordance for inspecting logos */
  .logo-carousel:hover .logo-track {
    animation-play-state: paused;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); } /* -50% because content is duplicated x2 */
  }

  .logo-item {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 36px;
  }

  .logo-item img {
    height: 100%;
    width: auto;
    max-width: 140px;
    object-fit: contain;
    opacity: 0.55;
    transition: opacity 0.25s ease, transform 0.25s ease;
    /* This filter forces ANY logo (colored or black) to render pure white.
       Remove this line if your logos already come as white PNGs/SVGs. */
    filter: brightness(0) invert(1);
  }

  .logo-item:hover img {
    opacity: 1;
    transform: scale(1.05);
  }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .logo-track { animation: none; }
  }

  @media (max-width: 700px) {
    .logo-track { gap: 3rem; }
    .logo-item { height: 28px; }
    .logo-item img { max-width: 100px; }
  }


  /* ════════════════════════════════════════════════════════
     SOCIAL BAR — bottom strip with platform icons
     ════════════════════════════════════════════════════════ */
  .social-bar {
    border-top: 1px solid var(--border);
    padding: 2rem 2rem 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .social-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .social-icons {
    display: flex;
    gap: 1.75rem;
    align-items: center;
  }

  .social-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 50%;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  .social-icons a:hover {
    border-color: var(--accent);
    background: rgba(200, 150, 60, 0.08);
    transform: translateY(-2px);
  }

  .social-icons svg {
    width: 18px;
    height: 18px;
    fill: var(--text);
    transition: fill 0.2s ease;
  }

  .social-icons a:hover svg {
    fill: var(--accent);
  }

  @media (max-width: 500px) {
    .social-icons { gap: 1.1rem; flex-wrap: wrap; justify-content: center; }
  }

</style>
